[package]
name = "thin-cancellation-token"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "A flat, one-shot cancellation token with lock-free status checks."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ldm0/thin-cancellation-token"
documentation = "https://docs.rs/thin-cancellation-token"
readme = "README.md"
keywords = ["async", "cancellation", "tokio", "synchronization"]
categories = ["asynchronous", "concurrency"]
include = [
    "/src/**",
    "/tests/**",
    "/benches/**",
    "/scripts/benchmark.py",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE*",
]

[dependencies]
pin-project-lite = "0.2.17"
tokio = { version = "1.53", default-features = false, features = ["sync"] }
triomphe = { version = "=0.1.16", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "sync"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }

[[bench]]
name = "cancellation"
harness = false

[[bench]]
name = "memory"
harness = false
